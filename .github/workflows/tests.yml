name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.16.9

      - name: Lint
        run: ruff check --output-format github .

  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            server/pyproject.toml
            server/requirements.txt

      - name: Check pinned requirements
        run: |
          python -m pip install pip-tools==7.5.3
          pip-compile --no-header --strip-extras --output-file=requirements.txt pyproject.toml
          git diff --exit-code -- requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt -e .[dev]

      - name: Run tests
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          pytest

  docker-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build --tag tatou-server:ci ./server

      - name: Check application dependencies inside the image
        run: docker run --rm --entrypoint python tatou-server:ci -c "import rmap; print('rmap import OK')"
