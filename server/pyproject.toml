[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF>=1.21.1",
	"numpy>=1.26",
	"Pillow>=10.0",
	"cryptography>=42",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"cryptography>=42,<51",
	"Pillow>=10,<13",
	"zxing-cpp==3.1.1",
	"rmap @ git+https://github.com/nharrand/RMAP.git@v1.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]


[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]
filterwarnings = [
    # PyMuPDF's generated SWIG bindings emit these on interpreter shutdown.
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    # RMAP 1.0.2 depends on PGPy 0.6.0, whose compatibility imports warn on
    # Python 3.12 / recent cryptography. Keep filters precise and third-party-only.
    "ignore:'imghdr' is deprecated.*:DeprecationWarning:pgpy\\.constants",
    "ignore:.* has been moved to cryptography\\.hazmat\\.decrepit.*:cryptography.utils.CryptographyDeprecationWarning:pgpy\\..*",
]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`
