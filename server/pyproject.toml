[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF>=1.21.1",
	"numpy>=1.26",
	"Pillow>=10.0",
	"cryptography>=42",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"rmap @ git+https://github.com/nharrand/RMAP.git@v1.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`
