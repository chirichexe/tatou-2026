[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF>=1.24.0",
	"numpy>=1.26",
	"Pillow>=10.0",
	"cryptography>=42",
	"reedsolo==1.7.0",
	"zxing-cpp==3.1.1",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"rmap @ git+https://github.com/nharrand/RMAP.git@v1.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff==0.16.9"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
src = ["src", "test"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, bandit (security),
# simplify, comprehensions, ruff-specific
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
# the rmap library, not the test/rmap folder
known-third-party = ["rmap"]

[tool.ruff.lint.per-file-ignores]
# tests use assert, fixed dummy passwords, temp paths and local tools
"test/**" = ["S101", "S105", "S106", "S107", "S108", "S603", "S607"]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`
