# Isolated stack for the end-to-end tests (see test_e2e/README.md).
# Same server image and database schema as production, but test-only keys and
# secrets, a separate project name and port, no monitoring. The storage volume
# (as in production) survives the server restart; `down -v` removes everything. Every variable is set by the test fixture.
name: tatou-e2e

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${E2E_PORT:-5055}:5000"
    volumes:
      - storage:/app/storage
      - ${E2E_KEYS_DIR:?}:/app/rmap-keys:ro
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=tatou
      - DB_PASSWORD=${E2E_DB_PASSWORD:?}
      - FLAG_1=${E2E_FLAG:?}
      - SECRET_KEY=${E2E_SECRET_KEY:?}
      - RMAP_SERVER_PUBLIC_KEY_PATH=${RMAP_SERVER_PUBLIC_KEY_PATH:-}
      - RMAP_SERVER_PRIVATE_KEY_PATH=${RMAP_SERVER_PRIVATE_KEY_PATH:-}
      - RMAP_CLIENT_KEYS_DIR=${RMAP_CLIENT_KEYS_DIR:-}
      - RMAP_DOCUMENT_ID=${RMAP_DOCUMENT_ID:-}
      - RMAP_WATERMARK_METHOD=${RMAP_WATERMARK_METHOD:-}
      - RMAP_WATERMARK_KEY=${RMAP_WATERMARK_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${E2E_DB_PASSWORD:?}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=tatou
      - MARIADB_PASSWORD=${E2E_DB_PASSWORD:?}
    volumes:
      - ../../db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  storage:

# Explicit subnet: works even when Docker's default address pools are exhausted
# or overlap with host (e.g. VPN) routes. Override with E2E_SUBNET if it clashes.
networks:
  default:
    ipam:
      config:
        - subnet: ${E2E_SUBNET:-172.28.99.0/24}
